name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://contatocerto:contatocerto-test@localhost:5432/contatocerto
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: contatocerto
          POSTGRES_PASSWORD: contatocerto-test
          POSTGRES_DB: contatocerto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contatocerto -d contatocerto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build shared package for typecheck
        run: pnpm --filter @contatocerto/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Apply all migrations
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up

      - name: Verify migration 010
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'contacts' AND column_name = 'selection_key'
            ) THEN
              RAISE EXCEPTION 'contacts.selection_key was not created';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'contacts'
                 AND indexname = 'contacts_selection_key_unique_idx'
                 AND indexdef LIKE '%UNIQUE%'
                 AND indexdef LIKE '%WHERE (selection_key IS NOT NULL)%'
            ) THEN
              RAISE EXCEPTION 'contacts selection_key partial unique index is invalid';
            END IF;
          END
          $$;
          SQL

      - name: Test PostgreSQL integrations
        run: pnpm --filter @contatocerto/api test:integration

      - name: Verify migration 013
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('matches_professional_shown_at_idx') IS NULL
              OR to_regclass('contacts_professional_created_at_idx') IS NULL
              OR to_regclass('reviews_published_professional_idx') IS NULL THEN
              RAISE EXCEPTION 'matching signal indexes missing';
            END IF;
          END $$;
          SQL

      - name: Verify migration 009
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches was not created';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass AND contype = 'p'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches primary key is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass
                 AND contype = 'f'
                 AND confrelid = 'channel_outbound_messages'::regclass
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass
                 AND contype = 'f'
                 AND confrelid = 'matches'::regclass
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches foreign keys are invalid';
            END IF;
            IF to_regclass('channel_outbound_message_matches_match_id_idx') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches match index is missing';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 011
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches_match_id_unique_idx') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_message_matches'
                 AND indexname = 'channel_outbound_message_matches_match_id_unique_idx'
                 AND indexdef LIKE '%UNIQUE%'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index is invalid';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 012
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'purpose'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_messages purpose column is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_type WHERE typname = 'channel_outbound_message_purpose'
            ) THEN
              RAISE EXCEPTION 'channel outbound purpose type is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_messages'
                 AND indexname = 'channel_outbound_messages_customer_reply_inbound_uidx'
            ) THEN
              RAISE EXCEPTION 'customer reply inbound uniqueness index is missing';
            END IF;
          END
          $$;
          SQL

      - name: Create rollback regression fixture
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          INSERT INTO search_requests (id, raw_text)
          VALUES ('00000000-0000-0000-0000-000000000001', 'eletricista');

          INSERT INTO search_conversations (
            id,
            status,
            pending_slot,
            original_raw_text,
            service_text,
            country_code,
            limit_value,
            search_request_id,
            expires_at,
            completed_at
          ) VALUES
            (
              '00000000-0000-0000-0000-000000000002',
              'active',
              'selection',
              'preciso de eletricista',
              'eletricista',
              'BR',
              3,
              '00000000-0000-0000-0000-000000000001',
              NOW() + INTERVAL '1 hour',
              NULL
            ),
            (
              '00000000-0000-0000-0000-000000000003',
              'completed',
              NULL,
              'preciso de eletricista',
              'eletricista',
              'BR',
              3,
              '00000000-0000-0000-0000-000000000001',
              NOW() + INTERVAL '1 hour',
              NOW()
            );

          UPDATE search_conversations
             SET status = 'cancelled',
                 pending_slot = NULL
           WHERE id = '00000000-0000-0000-0000-000000000002';
          SQL

      - name: Roll back migration 013
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 013 rollback preserves data
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('matches_professional_shown_at_idx') IS NOT NULL
              OR to_regclass('contacts_professional_created_at_idx') IS NOT NULL
              OR to_regclass('reviews_published_professional_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'matching signal indexes remained';
            END IF;
            IF (SELECT count(*) FROM search_conversations WHERE search_request_id = '00000000-0000-0000-0000-000000000001') <> 2 THEN
              RAISE EXCEPTION 'business records changed during index rollback';
            END IF;
          END $$;
          SQL

      - name: Roll back migration 012
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 012 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'purpose'
            ) OR EXISTS (
              SELECT 1 FROM pg_type WHERE typname = 'channel_outbound_message_purpose'
            ) THEN
              RAISE EXCEPTION 'channel outbound purpose schema remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 011
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 011 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches_match_id_unique_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 010
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 010 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'contacts' AND column_name = 'selection_key'
            ) OR to_regclass('contacts_selection_key_unique_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'contacts selection_key schema remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 009
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 009 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches') IS NOT NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 008
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify rollback compatibility
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
                FROM search_conversations
               WHERE id = '00000000-0000-0000-0000-000000000002'
                 AND search_request_id IS NOT NULL
            ) THEN
              RAISE EXCEPTION 'cancelled conversation retained search_request_id after rollback';
            END IF;

            IF NOT EXISTS (
              SELECT 1
                FROM search_conversations
               WHERE id = '00000000-0000-0000-0000-000000000003'
                 AND search_request_id = '00000000-0000-0000-0000-000000000001'
            ) THEN
              RAISE EXCEPTION 'completed conversation did not preserve search_request_id after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Reapply migrations 008 through 013
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up

      - name: Test PostgreSQL integrations after reapply
        run: pnpm --filter @contatocerto/api test:integration
