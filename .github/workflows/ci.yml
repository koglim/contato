name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://contatocerto:contatocerto-test@localhost:5432/contatocerto
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: contatocerto
          POSTGRES_PASSWORD: contatocerto-test
          POSTGRES_DB: contatocerto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contatocerto -d contatocerto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build shared package for typecheck
        run: pnpm --filter @contatocerto/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify generated n8n exports
        run: |
          pnpm build:workflows
          git diff --exit-code -- workflows/n8n/shared-delivery.json workflows/n8n/outbox-dispatcher.json workflows/n8n/inbox-recovery.json workflows/n8n/gateway.json workflows/n8n/media-consumer.json

      - name: B2 300 synthetic cases (mocked proposals, not model quality)
        run: pnpm --filter @contatocerto/api eval:b2 --split=all --summary --report=b2-frozen-report.json

      - name: B2 readiness interpretation and composition (mocked)
        run: pnpm --filter @contatocerto/api eval:b2 --suite=readiness --summary --report=b2-readiness-report.json

      - name: Save B2 synthetic evaluation traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-synthetic-evaluation-${{ github.sha }}
          path: apps/api/b2-*-report.json
          retention-days: 14

      - name: Apply all migrations
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up

      - name: Verify migration 010
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'contacts' AND column_name = 'selection_key'
            ) THEN
              RAISE EXCEPTION 'contacts.selection_key was not created';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'contacts'
                 AND indexname = 'contacts_selection_key_unique_idx'
                 AND indexdef LIKE '%UNIQUE%'
                 AND indexdef LIKE '%WHERE (selection_key IS NOT NULL)%'
            ) THEN
              RAISE EXCEPTION 'contacts selection_key partial unique index is invalid';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 016 before PostgreSQL integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'next_attempt_at'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_messages next_attempt_at is missing before integration tests';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_messages'
                 AND indexname = 'channel_outbound_messages_pending_next_attempt_idx'
            ) THEN
              RAISE EXCEPTION 'pending retry index is missing before integration tests';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 017 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF (SELECT COUNT(*) FROM information_schema.columns
              WHERE table_name = 'channel_outbound_messages'
                AND column_name IN ('sent_token_hash', 'delivery_hold_reason')) <> 2
              OR to_regclass('channel_outbound_recipient_queue_idx') IS NULL
              OR NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name = '017_add_outbound_delivery_receipt') THEN
              RAISE EXCEPTION 'migration 017 is incomplete';
            END IF;
          END $$;
          SQL

      - name: Verify migration 018 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name = '018_add_contextual_conversation')
              OR to_regclass('contextual_memories') IS NULL OR to_regclass('contextual_turns') IS NULL
              OR to_regclass('contextual_budgets') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'contextual_turns' AND column_name = 'reply_draft') THEN
              RAISE EXCEPTION 'migration 018 is incomplete';
            END IF;
          END $$;
          SQL

      - name: Verify migration 019 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='019_add_inbox_recovery')
              OR to_regclass('channel_inbound_recovery_events') IS NULL
              OR to_regclass('channel_inbound_recovery_queue_idx') IS NULL
              OR to_regclass('channel_inbound_recovery_phone_idx') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_inbound_messages' AND column_name='next_attempt_at') THEN
              RAISE EXCEPTION 'migration 019 is incomplete';
            END IF;
          END $$;
          SQL

      - name: Verify migration 020 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM pgmigrations WHERE name='020_add_durable_channel_media')
              OR to_regclass('channel_media_events') IS NULL OR to_regclass('channel_transport_events') IS NULL
              OR to_regclass('channel_media_queue_idx') IS NULL OR to_regclass('channel_media_retention_idx') IS NULL
              OR NOT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='channel_inbound_messages' AND column_name='media_pending')
            THEN RAISE EXCEPTION 'migration 020 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 021 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='021_add_professional_identity_foundation')
              OR to_regclass('accounts') IS NULL
              OR to_regclass('account_identifiers') IS NULL
              OR to_regclass('professional_memberships') IS NULL
              OR to_regclass('professional_membership_events') IS NULL
              OR to_regclass('account_identifiers_kind_value_uidx') IS NULL
              OR to_regclass('professional_memberships_active_professional_idx') IS NULL
            THEN RAISE EXCEPTION 'migration 021 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 022 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='022_add_professional_passwordless_auth')
              OR to_regclass('professional_auth_challenges') IS NULL
              OR to_regclass('professional_sessions') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='expires_at')
            THEN RAISE EXCEPTION 'migration 022 incomplete'; END IF;
          END $$;
          SQL

      - name: Test PostgreSQL integrations
        run: pnpm --filter @contatocerto/api test:integration

      - name: Verify migration 013
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('matches_professional_shown_at_idx') IS NULL
              OR to_regclass('contacts_professional_created_at_idx') IS NULL
              OR to_regclass('reviews_published_professional_idx') IS NULL THEN
              RAISE EXCEPTION 'matching signal indexes missing';
            END IF;
          END $$;
          SQL

      - name: Verify migration 009
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches was not created';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass AND contype = 'p'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches primary key is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass
                 AND contype = 'f'
                 AND confrelid = 'channel_outbound_messages'::regclass
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass
                 AND contype = 'f'
                 AND confrelid = 'matches'::regclass
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches foreign keys are invalid';
            END IF;
            IF to_regclass('channel_outbound_message_matches_match_id_idx') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches match index is missing';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 011
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches_match_id_unique_idx') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_message_matches'
                 AND indexname = 'channel_outbound_message_matches_match_id_unique_idx'
                 AND indexdef LIKE '%UNIQUE%'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index is invalid';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 012
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'purpose'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_messages purpose column is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_type WHERE typname = 'channel_outbound_message_purpose'
            ) THEN
              RAISE EXCEPTION 'channel outbound purpose type is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_messages'
                 AND indexname = 'channel_outbound_messages_customer_reply_inbound_uidx'
            ) THEN
              RAISE EXCEPTION 'customer reply inbound uniqueness index is missing';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 016 protected rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          INSERT INTO channel_outbound_messages
            (id, purpose, provider, recipient_phone_e164, text_content, next_attempt_at)
          VALUES
            ('00000000-0000-0000-0000-000000000016', 'professional_contact_notification', 'test', '+5566900000016', 'retry rollback fixture', NOW() + INTERVAL '1 minute');
          SQL
          set +e
          rollback_output=$(node node_modules/node-pg-migrate/bin/node-pg-migrate.js down 6 --single-transaction -m database/migrations --database-url-var DATABASE_URL 2>&1)
          rollback_status=$?
          set -e
          echo "$rollback_output"
          test "$rollback_status" -ne 0
          echo "$rollback_output" | grep -q 'OUTBOUND_RETRY_ROLLBACK_BLOCKED'
          echo "$rollback_output" | grep -q 'P0016'
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "DELETE FROM channel_outbound_messages WHERE id = '00000000-0000-0000-0000-000000000016'"

      - name: Verify migration 022 protected rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          WITH account AS (
            INSERT INTO accounts(id, status) VALUES ('00000000-0000-0000-0000-000000000022', 'active') RETURNING id
          ), identifier AS (
            INSERT INTO account_identifiers(id, account_id, kind, normalized_value, verified_at)
            SELECT '00000000-0000-0000-0001-000000000022', id, 'phone', '+5566900000022', NOW() FROM account RETURNING id
          )
          INSERT INTO professional_auth_challenges(account_identifier_id, code_hash, expires_at)
          SELECT id, repeat('a', 64), NOW() + INTERVAL '5 minutes' FROM identifier;
          SQL
          set +e
          rollback_output=$(node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL 2>&1)
          rollback_status=$?
          set -e
          echo "$rollback_output"
          test "$rollback_status" -ne 0
          echo "$rollback_output" | grep -q 'PROFESSIONAL_AUTH_ROLLBACK_BLOCKED'
          echo "$rollback_output" | grep -q 'P0022'
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DELETE FROM professional_auth_challenges WHERE account_identifier_id='00000000-0000-0000-0001-000000000022';
          DELETE FROM account_identifiers WHERE id='00000000-0000-0000-0001-000000000022';
          DELETE FROM accounts WHERE id='00000000-0000-0000-0000-000000000022';
          SQL

      - name: Create rollback regression fixture
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          INSERT INTO search_requests (id, raw_text)
          VALUES ('00000000-0000-0000-0000-000000000001', 'eletricista');

          -- Scenario B retains genuine compatible legacy data through all downs.
          INSERT INTO professionals (id, display_name, slug, phone_e164)
          VALUES ('00000000-0000-0000-0000-000000000004', 'Legacy rollback fixture', 'legacy-rollback-fixture', '+5566900000000');
          INSERT INTO contacts (id, search_request_id, professional_id)
          VALUES ('00000000-0000-0000-0000-000000000005', '00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000004');

          INSERT INTO search_conversations (
            id,
            status,
            pending_slot,
            original_raw_text,
            service_text,
            country_code,
            limit_value,
            search_request_id,
            expires_at,
            completed_at
          ) VALUES
            (
              '00000000-0000-0000-0000-000000000002',
              'active',
              'selection',
              'preciso de eletricista',
              'eletricista',
              'BR',
              3,
              '00000000-0000-0000-0000-000000000001',
              NOW() + INTERVAL '1 hour',
              NULL
            ),
            (
              '00000000-0000-0000-0000-000000000003',
              'completed',
              NULL,
              'preciso de eletricista',
              'eletricista',
              'BR',
              3,
              '00000000-0000-0000-0000-000000000001',
              NOW() + INTERVAL '1 hour',
              NOW()
            );

          UPDATE search_conversations
             SET status = 'cancelled',
                 pending_slot = NULL
           WHERE id = '00000000-0000-0000-0000-000000000002';
          SQL

      - name: Roll back migration 022 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('professional_auth_challenges') IS NOT NULL OR to_regclass('professional_sessions') IS NOT NULL
              OR EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='expires_at')
            THEN RAISE EXCEPTION 'migration 022 remained'; END IF;
          END $$;
          SQL

      - name: Roll back migration 021 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('accounts') IS NOT NULL OR to_regclass('account_identifiers') IS NOT NULL
              OR to_regclass('professional_memberships') IS NOT NULL
              OR to_regclass('professional_membership_events') IS NOT NULL
            THEN RAISE EXCEPTION 'migration 021 remained'; END IF;
          END $$;
          SQL

      - name: Roll back migration 020 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('channel_media_events') IS NOT NULL OR to_regclass('channel_transport_events') IS NOT NULL
              OR EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='channel_inbound_messages' AND column_name='media_pending')
            THEN RAISE EXCEPTION 'migration 020 remained'; END IF;
          END $$;
          SQL

      - name: Roll back migration 019 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('channel_inbound_recovery_events') IS NOT NULL OR EXISTS (
              SELECT 1 FROM information_schema.columns WHERE table_name='channel_inbound_messages' AND column_name='recovery_state') THEN
              RAISE EXCEPTION 'migration 019 remained after rollback';
            END IF;
          END $$;
          SQL

      - name: Roll back migration 018 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c "DO \$\$ BEGIN IF to_regclass('contextual_memories') IS NOT NULL THEN RAISE EXCEPTION '018 remained'; END IF; END \$\$;"

      - name: Roll back migration 017 with compatible data
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL

      - name: Verify migration 017 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_name = 'channel_outbound_messages'
                AND column_name IN ('sent_token_hash', 'delivery_hold_reason'))
              OR to_regclass('channel_outbound_recipient_queue_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'migration 017 remained after rollback';
            END IF;
          END $$;
          SQL

      - name: Roll back migration 016 with compatible data
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 016 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_name = 'channel_outbound_messages' AND column_name = 'next_attempt_at')
              OR to_regclass('channel_outbound_messages_pending_next_attempt_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'migration 016 schema remained after rollback';
            END IF;
          END $$;
          SQL

      - name: Roll back migration 015 with compatible data
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Roll back migration 014 with compatible data
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 014 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND column_name IN
                ('bilateral_snapshot', 'public_code', 'selection_conversation_id', 'bilateral_pending', 'bilateral_response', 'business_key', 'bilateral_notice_version'))
              OR to_regclass('contacts_public_code_unique_idx') IS NOT NULL
              OR to_regprocedure('protect_bilateral_contact_snapshot()') IS NOT NULL THEN
              RAISE EXCEPTION 'migration 014 schema remained after compatible rollback';
            END IF;
          END $$;
          SQL

      - name: Roll back migration 013
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 013 rollback preserves data
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('matches_professional_shown_at_idx') IS NOT NULL
              OR to_regclass('contacts_professional_created_at_idx') IS NOT NULL
              OR to_regclass('reviews_published_professional_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'matching signal indexes remained';
            END IF;
            IF (SELECT count(*) FROM search_conversations WHERE search_request_id = '00000000-0000-0000-0000-000000000001') <> 2 THEN
              RAISE EXCEPTION 'business records changed during index rollback';
            END IF;
          END $$;
          SQL

      - name: Roll back migration 012
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 012 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'purpose'
            ) OR EXISTS (
              SELECT 1 FROM pg_type WHERE typname = 'channel_outbound_message_purpose'
            ) THEN
              RAISE EXCEPTION 'channel outbound purpose schema remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 011
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 011 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches_match_id_unique_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 010
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 010 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'contacts' AND column_name = 'selection_key'
            ) OR to_regclass('contacts_selection_key_unique_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'contacts selection_key schema remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 009
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify migration 009 rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches') IS NOT NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches remained after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Roll back migration 008
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL down

      - name: Verify rollback compatibility
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM contacts
              WHERE id = '00000000-0000-0000-0000-000000000005'
                AND search_request_id = '00000000-0000-0000-0000-000000000001'
                AND professional_id = '00000000-0000-0000-0000-000000000004'
                AND status = 'requested') THEN
              RAISE EXCEPTION 'compatible legacy contact was not preserved';
            END IF;
            IF EXISTS (
              SELECT 1
                FROM search_conversations
               WHERE id = '00000000-0000-0000-0000-000000000002'
                 AND search_request_id IS NOT NULL
            ) THEN
              RAISE EXCEPTION 'cancelled conversation retained search_request_id after rollback';
            END IF;

            IF NOT EXISTS (
              SELECT 1
                FROM search_conversations
               WHERE id = '00000000-0000-0000-0000-000000000003'
                 AND search_request_id = '00000000-0000-0000-0000-000000000001'
            ) THEN
              RAISE EXCEPTION 'completed conversation did not preserve search_request_id after rollback';
            END IF;
          END
          $$;
          SQL

      - name: Reapply migrations 008 through 022
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up

