name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://contatocerto:contatocerto-test@localhost:5432/contatocerto
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: contatocerto
          POSTGRES_PASSWORD: contatocerto-test
          POSTGRES_DB: contatocerto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contatocerto -d contatocerto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build shared package for typecheck
        run: pnpm --filter @contatocerto/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify generated n8n exports
        run: |
          pnpm build:workflows
          git diff --exit-code -- workflows/n8n/shared-delivery.json workflows/n8n/outbox-dispatcher.json workflows/n8n/inbox-recovery.json workflows/n8n/gateway.json workflows/n8n/media-consumer.json

      - name: B2 300 synthetic cases (mocked proposals, not model quality)
        run: pnpm --filter @contatocerto/api eval:b2 --split=all --summary --report=b2-frozen-report.json

      - name: B2 readiness interpretation and composition (mocked)
        run: pnpm --filter @contatocerto/api eval:b2 --suite=readiness --summary --report=b2-readiness-report.json

      - name: B2 regression v1 (mocked)
        run: pnpm --filter @contatocerto/api eval:b2 --suite=regression --summary --report=b2-regression-report.json

      - name: B2 latency v1 (local deterministic benchmark)
        run: pnpm --filter @contatocerto/api eval:latency

      - name: Save B2 synthetic evaluation traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-synthetic-evaluation-${{ github.sha }}
          path: apps/api/b2-*-report.json
          retention-days: 14

      - name: Apply all migrations
        run: node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up

      - name: Verify migration 010
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'contacts' AND column_name = 'selection_key'
            ) THEN
              RAISE EXCEPTION 'contacts.selection_key was not created';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'contacts'
                 AND indexname = 'contacts_selection_key_unique_idx'
                 AND indexdef LIKE '%UNIQUE%'
                 AND indexdef LIKE '%WHERE (selection_key IS NOT NULL)%'
            ) THEN
              RAISE EXCEPTION 'contacts selection_key partial unique index is invalid';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 016 before PostgreSQL integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'next_attempt_at'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_messages next_attempt_at is missing before integration tests';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_messages'
                 AND indexname = 'channel_outbound_messages_pending_next_attempt_idx'
            ) THEN
              RAISE EXCEPTION 'pending retry index is missing before integration tests';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 017 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF (SELECT COUNT(*) FROM information_schema.columns
              WHERE table_name = 'channel_outbound_messages'
                AND column_name IN ('sent_token_hash', 'delivery_hold_reason')) <> 2
              OR to_regclass('channel_outbound_recipient_queue_idx') IS NULL
              OR NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name = '017_add_outbound_delivery_receipt') THEN
              RAISE EXCEPTION 'migration 017 is incomplete';
            END IF;
          END $$;
          SQL

      - name: Verify migration 018 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name = '018_add_contextual_conversation')
              OR to_regclass('contextual_memories') IS NULL OR to_regclass('contextual_turns') IS NULL
              OR to_regclass('contextual_budgets') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'contextual_turns' AND column_name = 'reply_draft') THEN
              RAISE EXCEPTION 'migration 018 is incomplete';
            END IF;
          END $$;
          SQL

      - name: Verify migration 019 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='019_add_inbox_recovery')
              OR to_regclass('channel_inbound_recovery_events') IS NULL
              OR to_regclass('channel_inbound_recovery_queue_idx') IS NULL
              OR to_regclass('channel_inbound_recovery_phone_idx') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_inbound_messages' AND column_name='next_attempt_at') THEN
              RAISE EXCEPTION 'migration 019 is incomplete';
            END IF;
          END $$;
          SQL

      - name: Verify migration 020 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM pgmigrations WHERE name='020_add_durable_channel_media')
              OR to_regclass('channel_media_events') IS NULL OR to_regclass('channel_transport_events') IS NULL
              OR to_regclass('channel_media_queue_idx') IS NULL OR to_regclass('channel_media_retention_idx') IS NULL
              OR NOT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='channel_inbound_messages' AND column_name='media_pending')
            THEN RAISE EXCEPTION 'migration 020 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 021 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='021_add_professional_identity_foundation')
              OR to_regclass('accounts') IS NULL
              OR to_regclass('account_identifiers') IS NULL
              OR to_regclass('professional_memberships') IS NULL
              OR to_regclass('professional_membership_events') IS NULL
              OR to_regclass('account_identifiers_kind_value_uidx') IS NULL
              OR to_regclass('professional_memberships_active_professional_idx') IS NULL
            THEN RAISE EXCEPTION 'migration 021 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 022 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='022_add_professional_passwordless_auth')
              OR to_regclass('professional_auth_challenges') IS NULL
              OR to_regclass('professional_sessions') IS NULL
              OR to_regclass('professional_auth_challenges_one_active_idx') IS NULL
              OR to_regclass('channel_outbound_messages_auth_claim_idx') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='expires_at')
            THEN RAISE EXCEPTION 'migration 022 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 023 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='023_add_professional_onboarding_audit')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='professional_membership_events' AND column_name='actor_account_id')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='professional_membership_events' AND column_name='source')
            THEN RAISE EXCEPTION 'migration 023 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 024 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='024_add_professional_management_mode')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='professionals' AND column_name='management_mode')
              OR NOT EXISTS (
                SELECT 1 FROM pg_constraint
                 WHERE conrelid = 'professional_membership_events'::regclass
                   AND conname = 'professional_membership_events_source_chk'
                   AND pg_get_constraintdef(oid) LIKE '%legacy_claim%'
              )
            THEN RAISE EXCEPTION 'migration 024 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 025 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='025_add_professional_subscriptions')
              OR to_regclass('subscription_plans') IS NULL
              OR to_regclass('subscription_plan_entitlements') IS NULL
              OR to_regclass('professional_subscriptions') IS NULL
              OR to_regclass('professional_subscription_events') IS NULL
              OR NOT EXISTS (SELECT 1 FROM subscription_plans WHERE code='marketplace_standard_v1')
              OR NOT EXISTS (SELECT 1 FROM subscription_plan_entitlements WHERE entitlement_key='marketplace_access')
              OR to_regprocedure('protect_professional_subscription_events()') IS NULL
            THEN RAISE EXCEPTION 'migration 025 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 026 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='026_add_contact_completions')
              OR to_regclass('contact_completions') IS NULL
              OR to_regclass('contact_completion_events') IS NULL
              OR to_regclass('contact_completions_contact_id_key') IS NULL
              OR to_regclass('contact_completion_events_contact_idx') IS NULL
              OR to_regclass('contact_completion_events_completion_idx') IS NULL
              OR to_regclass('contact_completion_events_inbound_idx') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='completion_event_id')
              OR to_regprocedure('protect_contact_completion_events()') IS NULL
            THEN RAISE EXCEPTION 'migration 026 incomplete'; END IF;
          END $$;
          SQL

      - name: Verify migration 027 before integrations
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pgmigrations WHERE name='027_add_connection_lifecycle_v2')
              OR to_regclass('professional_unavailability_events') IS NULL
              OR to_regclass('professional_unavailability_events_contact_idx') IS NULL
              OR to_regclass('professional_unavailability_events_prof_idx') IS NULL
              OR to_regclass('professional_unavailability_events_inbound_idx') IS NULL
              OR to_regclass('contacts_bilateral_search_professional_unique_idx') IS NULL
              OR to_regclass('contacts_active_professional_idx') IS NULL
              OR to_regprocedure('protect_professional_unavailability_event()') IS NULL
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='professional_unavailability_event_id')
              OR to_regclass('channel_outbound_messages_unavailability_event_idx') IS NULL
            THEN RAISE EXCEPTION 'migration 027 incomplete'; END IF;
          END $$;
          SQL

      - name: Test PostgreSQL integrations
        run: pnpm --filter @contatocerto/api test:integration

      - name: Verify migration 027 protected rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c 'CREATE DATABASE contatocerto_027_protected'
          protected_url='postgresql://contatocerto:contatocerto-test@localhost:5432/contatocerto_027_protected'
          DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up
          psql -v ON_ERROR_STOP=1 "$protected_url" <<'SQL'
          INSERT INTO customers (id, phone_e164) VALUES ('00000000-0000-0000-0027-000000000001', '+5566900000027');
          INSERT INTO search_requests (id, customer_id, raw_text, status) VALUES ('00000000-0000-0000-0027-000000000002', '00000000-0000-0000-0027-000000000001', 'eletricista', 'selected');
          INSERT INTO professionals (id, display_name, slug, phone_e164) VALUES ('00000000-0000-0000-0027-000000000003', 'Fixture 027', 'fixture-027', '+5566900000028');
          INSERT INTO contacts (id, search_request_id, professional_id, status)
          VALUES ('00000000-0000-0000-0027-000000000004', '00000000-0000-0000-0027-000000000002', '00000000-0000-0000-0027-000000000003', 'shared');
          INSERT INTO channel_inbound_messages (id, provider, provider_message_id, phone_e164, raw_text)
          VALUES ('00000000-0000-0000-0027-000000000005', 'test', 'msg-027', '+5566900000028', 'recuso CC-02700001');
          INSERT INTO professional_unavailability_events (id, contact_id, professional_id, inbound_id, origin, rule_version)
          VALUES ('00000000-0000-0000-0027-000000000006', '00000000-0000-0000-0027-000000000004', '00000000-0000-0000-0027-000000000003', '00000000-0000-0000-0027-000000000005', 'channel_inbox', 'connection-v2');
          SQL
          set +e
          rollback_output=$(DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL 2>&1)
          rollback_status=$?
          set -e
          echo "$rollback_output"
          test "$rollback_status" -ne 0
          echo "$rollback_output" | grep -q 'CONNECTION_LIFECYCLE_V2_ROLLBACK_BLOCKED'
          echo "$rollback_output" | grep -q 'P0027'
          psql -v ON_ERROR_STOP=1 'postgresql://contatocerto:contatocerto-test@localhost:5432/postgres' -c 'DROP DATABASE contatocerto_027_protected'

      - name: Roll back migration 027 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('professional_unavailability_events') IS NOT NULL
              OR EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='professional_unavailability_event_id')
              OR EXISTS (SELECT 1 FROM pgmigrations WHERE name='027_add_connection_lifecycle_v2')
            THEN RAISE EXCEPTION 'migration 027 remained after compatible rollback'; END IF;
          END $$;
          SQL

      - name: Verify migration 026 protected rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c 'CREATE DATABASE contatocerto_026_protected'
          protected_url='postgresql://contatocerto:contatocerto-test@localhost:5432/contatocerto_026_protected'
          DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up
          # Roll back migration 027 first so the protected test targets 026
          DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$protected_url" <<'SQL'
          INSERT INTO customers (id, phone_e164) VALUES ('00000000-0000-0000-0026-000000000001', '+5566900000026');
          INSERT INTO search_requests (id, customer_id, raw_text, status) VALUES ('00000000-0000-0000-0026-000000000002', '00000000-0000-0000-0026-000000000001', 'eletricista', 'selected');
          INSERT INTO professionals (id, display_name, slug, phone_e164) VALUES ('00000000-0000-0000-0026-000000000003', 'Fixture 026', 'fixture-026', '+5566900000027');
          INSERT INTO contacts (id, search_request_id, professional_id, status)
          VALUES ('00000000-0000-0000-0026-000000000004', '00000000-0000-0000-0026-000000000002', '00000000-0000-0000-0026-000000000003', 'accepted');
          INSERT INTO contact_completions (id, contact_id, state, declared_by, declared_at)
          VALUES ('00000000-0000-0000-0026-000000000005', '00000000-0000-0000-0026-000000000004', 'pending_confirmation', 'customer', NOW());
          SQL
          set +e
          rollback_output=$(DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL 2>&1)
          rollback_status=$?
          set -e
          echo "$rollback_output"
          test "$rollback_status" -ne 0
          echo "$rollback_output" | grep -q 'CONTACT_COMPLETION_ROLLBACK_BLOCKED'
          echo "$rollback_output" | grep -q 'P0026'
          psql -v ON_ERROR_STOP=1 'postgresql://contatocerto:contatocerto-test@localhost:5432/postgres' -c 'DROP DATABASE contatocerto_026_protected'

      - name: Roll back migration 026 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('contact_completions') IS NOT NULL
              OR to_regclass('contact_completion_events') IS NOT NULL
              OR EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='channel_outbound_messages' AND column_name='completion_event_id')
              OR EXISTS (SELECT 1 FROM pgmigrations WHERE name='026_add_contact_completions')
            THEN RAISE EXCEPTION 'migration 026 remained after compatible rollback'; END IF;
          END $$;
          SQL

      - name: Verify migration 025 protected rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -c 'CREATE DATABASE contatocerto_025_protected'
          protected_url='postgresql://contatocerto:contatocerto-test@localhost:5432/contatocerto_025_protected'
          DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js -m database/migrations --database-url-var DATABASE_URL up
          # Roll back migrations 027 and 026 first so the protected test targets 025
          DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$protected_url" <<'SQL'
          SELECT id INTO TEMP plan_tmp FROM subscription_plans WHERE code = 'marketplace_standard_v1';
          INSERT INTO professionals (id, display_name, slug, phone_e164)
          VALUES ('00000000-0000-0000-0025-000000000001', 'Sub Rollback Fixture', 'sub-rollback-fixture-025', '+5566900000025');
          INSERT INTO professional_subscriptions (id, professional_id, plan_id, starts_at, ends_at)
          SELECT '00000000-0000-0000-0025-000000000002',
                 '00000000-0000-0000-0025-000000000001',
                 id,
                 NOW() - INTERVAL '1 hour',
                 NOW() + INTERVAL '30 days'
          FROM subscription_plans WHERE code = 'marketplace_standard_v1';
          SQL
          set +e
          rollback_output=$(DATABASE_URL="$protected_url" node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL 2>&1)
          rollback_status=$?
          set -e
          echo "$rollback_output"
          test "$rollback_status" -ne 0
          echo "$rollback_output" | grep -q 'PROFESSIONAL_SUBSCRIPTION_ROLLBACK_BLOCKED'
          echo "$rollback_output" | grep -q 'P0025'
          psql -v ON_ERROR_STOP=1 'postgresql://contatocerto:contatocerto-test@localhost:5432/postgres' -c 'DROP DATABASE contatocerto_025_protected'

      - name: Roll back migration 025 with compatible data
        run: |
          node node_modules/node-pg-migrate/bin/node-pg-migrate.js down --single-transaction -m database/migrations --database-url-var DATABASE_URL
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$ BEGIN
            IF to_regclass('subscription_plans') IS NOT NULL
              OR to_regclass('subscription_plan_entitlements') IS NOT NULL
              OR to_regclass('professional_subscriptions') IS NOT NULL
              OR to_regclass('professional_subscription_events') IS NOT NULL
              OR EXISTS (SELECT 1 FROM pgmigrations WHERE name='025_add_professional_subscriptions')
            THEN RAISE EXCEPTION 'migration 025 remained after compatible rollback'; END IF;
          END $$;
          SQL

      - name: Verify migration 013
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('matches_professional_shown_at_idx') IS NULL
              OR to_regclass('contacts_professional_created_at_idx') IS NULL
              OR to_regclass('reviews_published_professional_idx') IS NULL THEN
              RAISE EXCEPTION 'matching signal indexes missing';
            END IF;
          END $$;
          SQL

      - name: Verify migration 009
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches was not created';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass AND contype = 'p'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches primary key is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass
                 AND contype = 'f'
                 AND confrelid = 'channel_outbound_messages'::regclass
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conrelid = 'channel_outbound_message_matches'::regclass
                 AND contype = 'f'
                 AND confrelid = 'matches'::regclass
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches foreign keys are invalid';
            END IF;
            IF to_regclass('channel_outbound_message_matches_match_id_idx') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches match index is missing';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 011
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('channel_outbound_message_matches_match_id_unique_idx') IS NULL THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_message_matches'
                 AND indexname = 'channel_outbound_message_matches_match_id_unique_idx'
                 AND indexdef LIKE '%UNIQUE%'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_message_matches unique reservation index is invalid';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 012
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
               WHERE table_name = 'channel_outbound_messages' AND column_name = 'purpose'
            ) THEN
              RAISE EXCEPTION 'channel_outbound_messages purpose column is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_type WHERE typname = 'channel_outbound_message_purpose'
            ) THEN
              RAISE EXCEPTION 'channel outbound purpose type is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE tablename = 'channel_outbound_messages'
                 AND indexname = 'channel_outbound_messages_customer_reply_inbound_uidx'
            ) THEN
              RAISE EXCEPTION 'customer reply inbound uniqueness index is missing';
            END IF;
          END
          $$;
          SQL

      - name: Verify migration 016 protected rollback
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'SQL'
          INSERT INTO channel_outbound_messages
            (id, purpose, provider, recipient_phone_e164, text_content, next_attempt_at)
          VALUES
            ('00000000-0000-0000-0000-000000000016', 'professional_contact_notification', 'test', '+5566900000016', 'retry rollback fixture', NOW() + INTERVAL '1 minute');
          SQL
          set +e
          rollback_output=$(node node_modules/node-pg-migrate/bin/node-pg-migrate.js down 10 --single-transaction -m database/migrations --database-url-var DATABASE_URL 2>&1)
